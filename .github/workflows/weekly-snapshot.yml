name: Weekly RRG snapshot

on:
  schedule:
    - cron: "17 8 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this snapshot is being run"
        required: false
        default: "Manual refresh"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rrg-weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python -m pip install -e ".[dev]"
      - name: Prepare data branch worktree
        run: |
          if git ls-remote --exit-code --heads origin data; then
            git clone --branch data --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-worktree
          else
            git init --initial-branch=data data-worktree
            git -C data-worktree remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -C data-worktree config user.name "rrg-atlas-bot"
          git -C data-worktree config user.email "rrg-atlas-bot@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate and validate verified snapshot
        run: python -m pipeline.cli --output runner-output --data-root data-worktree
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      - name: Commit immutable data snapshot
        run: |
          cd data-worktree
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: publish weekly RRG snapshot"
          git push origin data
      - id: snapshot
        name: Prepare static snapshot files
        run: |
          rm -rf web/public/data/snapshots web/public/data/latest.json web/public/data/index.json
          mkdir -p web/public/data
          cp data-worktree/latest.json data-worktree/index.json web/public/data/
          cp -R data-worktree/snapshots web/public/data/
          SNAPSHOT_ID="$(node -e "const s=require('./data-worktree/latest.json'); process.stdout.write(s.snapshot_id)")"
          echo "snapshot_id=${SNAPSHOT_ID}" >> "$GITHUB_OUTPUT"
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public RRG deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          test -n "$EXPECTED_SNAPSHOT_ID"
          for attempt in {1..12}; do
            echo "Public deployment check ${attempt}/12: ${PAGE_URL}"
            curl --fail --silent --show-error --location "${PAGE_URL}" -o deployed-index.html || true
            curl --fail --silent --show-error --location "${PAGE_URL}data/latest.json" -o deployed-latest.json || true
            if test -s deployed-index.html && grep -q 'assets/index-' deployed-index.html && test -s deployed-latest.json; then
              ACTUAL_SNAPSHOT_ID="$(node -e "const s=require('./deployed-latest.json'); process.stdout.write(s.snapshot_id)")"
              if test "$ACTUAL_SNAPSHOT_ID" = "$EXPECTED_SNAPSHOT_ID"; then
                echo "Verified public RRG deployment for ${ACTUAL_SNAPSHOT_ID}."
                exit 0
              fi
              echo "Expected ${EXPECTED_SNAPSHOT_ID}; public site returned ${ACTUAL_SNAPSHOT_ID}."
            fi
            sleep 10
          done
          echo "Public RRG deployment could not be verified."
          exit 1
