name: Weekly RRG snapshot

on:
  schedule:
    - cron: "17 8 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this snapshot is being run"
        required: false
        default: "Manual refresh"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rrg-weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python -m pip install -e ".[dev]"
      - name: Prepare data branch worktree
        run: |
          git config user.name "rrg-atlas-bot"
          git config user.email "rrg-atlas-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data; then
            git clone --branch data --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-worktree
          else
            mkdir data-worktree && cd data-worktree
            git init
            git checkout --orphan data
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate and validate verified snapshot
        run: python -m pipeline.cli --output runner-output --data-root data-worktree
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      - name: Commit immutable data snapshot
        run: |
          cd data-worktree
          git add .
          git commit -m "data: publish weekly RRG snapshot" || exit 0
          git push origin data
      - name: Prepare static snapshot files
        run: |
          rm -rf web/public/data/snapshots web/public/data/latest.json web/public/data/index.json
          mkdir -p web/public/data
          cp data-worktree/latest.json data-worktree/index.json web/public/data/
          cp -R data-worktree/snapshots web/public/data/
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deployment
        uses: actions/deploy-pages@v4

